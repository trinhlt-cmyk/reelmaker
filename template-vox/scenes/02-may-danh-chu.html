<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>02 Máy đánh chữ</title>
<link rel="stylesheet" href="../shared.css">
<style>
  .cutout { left: 980px; top: 170px; width: 840px; height: 560px; --r: 2deg; animation-delay: .2s; }
  .note { left: 110px; top: 250px; width: 820px; --r: -1.5deg; animation-delay: .9s; }
  .note mark { animation-delay: 4.2s; }
  .tag { left: 1000px; top: 770px; animation-delay: 4.4s; }
</style>
</head>
<body>
  <div class="board">
    <figure class="cutout tape"><img src="../assets/may-danh-chu.jpg" alt=""></figure>
    <div class="note"><small>Máy đánh chữ</small>Sholes &amp; Glidden, <mark>bán ra năm 1874</mark></div>
    <!-- khoanh bàn phím khi giọng nói "máy đánh chữ" -->
    <div class="ring" data-at="2.0" style="left:1215px; top:540px; width:470px; height:170px"></div>
    <div class="tag red">1874</div>
  </div>
  <script src="../vox.js"></script>
</body>
</html>
