<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>03 Công thức</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
  <svg class="scene" viewBox="0 0 1920 1080">
    <g><polygon points="560,600 800,600 560,420"/><polyline class="thin" points="560,576 584,576 584,600"/><rect class="blue" x="380" y="420" width="180" height="180"/><rect class="green" x="560" y="600" width="240" height="240"/><polygon class="yellow" points="560,420 800,600 980,360 740,180"/></g>
  </svg>
  <div class="tex c-blue" data-tex="a^2" data-indicate="2.6" style="left:470px; top:510px"></div>
  <div class="tex c-green" data-tex="b^2" data-indicate="2.9" style="left:680px; top:720px"></div>
  <div class="tex c-yellow" data-tex="c^2" data-indicate="4.4" style="left:770px; top:390px"></div>
  <!-- màu từng số hạng khớp với hình vuông của nó -->
  <div class="tex big" data-tex="{\color{#58c4dd}a^2} + {\color{#83c167}b^2} = {\color{#f4d345}c^2}" data-write="1.2-3.0" style="left:1440px; top:500px"></div>
  <div class="note" data-fade="5.2" style="left:1150px; top:640px">3² + 4² = 9 + 16 = 25 = 5²</div>
  <script src="../math.js"></script>
</body>
</html>
