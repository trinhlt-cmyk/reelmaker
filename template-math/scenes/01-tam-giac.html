<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>01 Tam giác vuông</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="title" data-fade="0.2">Định lý Pythagoras</div>
  <svg class="scene" viewBox="0 0 1920 1080">
    <g data-create="0.8-2.4"><polygon points="560,600 800,600 560,420"/><polyline class="thin" points="560,576 584,576 584,600"/></g>
  </svg>
  <!-- nhãn cạnh hiện đúng lúc giọng đọc nhắc tới -->
  <div class="tex c-blue" data-tex="a" data-write="3.2-3.6" style="left:528px; top:512px"></div>
  <div class="tex c-green" data-tex="b" data-write="3.9-4.3" style="left:680px; top:642px"></div>
  <div class="tex c-yellow" data-tex="c" data-write="5.4-5.8" style="left:706px; top:478px"></div>
  <script src="../math.js"></script>
</body>
</html>
