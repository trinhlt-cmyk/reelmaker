<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>08 Tổng kết</title>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../lib/transit.css">
<script src="../assets/map/metro.js"></script>
</head>
<body class="map">
  <div class="big" style="top:1020px; font-size:150px; animation:rise .5s ease-out 1.6s both">~<b data-transit="totalMin">29</b> phút</div>
  <div class="ttl" style="top:1190px; font-size:44px; -webkit-text-stroke:6px rgba(0,0,0,.85); animation:pop .4s ease 1.9s both">Từ căn hộ tới <b data-transit="toName">Văn Miếu</b></div>
  <div class="chips" style="bottom:600px"><span class="pop" style="animation-delay:2.3s"><b data-transit="walkMin.0">5</b>' đi bộ</span><span class="pop" style="animation-delay:2.45s"><b data-transit="metroMin">14</b>' metro</span><span class="pop" style="animation-delay:2.6s"><b data-transit="walkMin.1">10</b>' đi bộ</span></div>
  <div class="sub" style="bottom:560px; font-size:22px; animation:pop .4s ease 2.9s both">Ước tính · metro <b data-transit="metroKm">7,7</b> km · <b data-transit="stations.length">8</b> ga · đi bộ 5 km/h</div>
  <div class="m-vig"></div>
  <div class="wm" style="color:#fff">Video demo · không phải tin rao bán</div>
  <div class="m-attrib">© OpenStreetMap</div>
  <script src="../lib/transit.js"></script>
  <script>
    // lùi ra toàn hành trình (khung bao căn hộ → Văn Miếu, chừa chỗ cho chữ ở dưới)
    const a = TRANSIT.metro.from, b = TRANSIT.metro.to;
    // cả hành trình (kể cả nhãn hai đầu) nằm gọn ở nửa trên khung, tâm ở y = 600
    // không lùi xa hơn mức ảnh bản đồ còn phủ kín khung
    const fill = Math.max(1080 / TRANSIT.metro.width, 1920 / TRANSIT.metro.height);
    const z = Math.max(fill, Math.min(1080 * 0.5 / Math.abs(b[0] - a[0]), 820 / Math.abs(b[1] - a[1])));
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + (960 - 560) / z];
    Transit.create({ data: 'metro',
      walkFrom: 'done', line: 'done', walkTo: 'done',
      cam: [[0, 'to', 1.2], [1.6, mid, z]],
      labels: [{ at: 1.5, xy: 'to', text: 'Văn Miếu', side: 'left' }],
    });
  </script>
</body>
</html>
